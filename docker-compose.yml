services:
  # =====================================================================
  # 1. REVERSE PROXY (Traefik v3.2)
  # =====================================================================
  reverse-proxy:
    image: traefik:latest
    container_name: reverse-proxy
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --log.level=DEBUG
      - --entrypoints.web.address=:80
    ports:
      - "80:80"       # Punctul unic de intrare pentru toata aplicatia
      - "8082:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_logs:/var/log/traefik
    networks:
      - demo_net

  # =====================================================================
  # 2. BAZELE DE DATE
  # =====================================================================
  user-db:
    image: mysql:8.4
    container_name: user-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${USER_DB_NAME}
      MYSQL_USER: ${USER_DB_USER}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${USER_DB_PORT}:3306"
    volumes:
      - user-mysql-data:/var/lib/mysql
    networks:
      - demo_net

  device-db:
    image: mysql:8.4
    container_name: device-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DEVICE_DB_NAME}
      MYSQL_USER: ${DEVICE_DB_USER}
      MYSQL_PASSWORD: ${DEVICE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DEVICE_DB_PORT}:3306"
    volumes:
      - device-mysql-data:/var/lib/mysql
    networks:
      - demo_net

  auth-db:
    image: mysql:8.4
    container_name: auth-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME}
      MYSQL_USER: ${AUTH_DB_USER}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:3306"
    volumes:
      - auth-mysql-data:/var/lib/mysql
    networks:
      - demo_net


  # =====================================================================
  # 3. USER SERVICE (cu Load Balancing - 2 replici)
  # =====================================================================
  user-service:
    build:
      context: ./user-microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      DB_HOST: user-db
      DB_PORT: 3306
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      PORT: 8080
    depends_on:
      - user-db
    networks:
      - demo_net
    labels:
      - "traefik.enable=true"
      # Router public pentru Swagger UI si OpenAPI docs (fara autentificare)
      - "traefik.http.routers.user-service-swagger.rule=PathPrefix(`/user-service/swagger-ui`) || PathPrefix(`/user-service/v3/api-docs`)"
      - "traefik.http.routers.user-service-swagger.entrypoints=web"
      - "traefik.http.routers.user-service-swagger.priority=100"
      - "traefik.http.routers.user-service-swagger.service=user-service"
      # Router protejat pentru API (cu ForwardAuth JWT via auth-service)
      - "traefik.http.routers.user-service.rule=PathPrefix(`/user-service`)"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.routers.user-service.priority=50"
      - "traefik.http.routers.user-service.middlewares=jwt-auth@docker"
      - "traefik.http.routers.user-service.service=user-service"
      - "traefik.http.services.user-service.loadbalancer.server.port=8080"

  # =====================================================================
  # 4. DEVICE SERVICE (cu Load Balancing - 2 replici)
  # =====================================================================
  device-service:
    build:
      context: ./device-microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      DB_HOST: device-db
      DB_PORT: 3306
      DB_NAME: ${DEVICE_DB_NAME}
      DB_USER: ${DEVICE_DB_USER}
      DB_PASSWORD: ${DEVICE_DB_PASSWORD}
      PORT: 8081
    depends_on:
      - device-db
    networks:
      - demo_net
    labels:
      - "traefik.enable=true"
      # Router public pentru Swagger UI si OpenAPI docs (fara autentificare)
      - "traefik.http.routers.device-service-swagger.rule=PathPrefix(`/device-service/swagger-ui`) || PathPrefix(`/device-service/v3/api-docs`)"
      - "traefik.http.routers.device-service-swagger.entrypoints=web"
      - "traefik.http.routers.device-service-swagger.priority=100"
      - "traefik.http.routers.device-service-swagger.service=device-service"
      # Router protejat pentru API (cu ForwardAuth JWT via auth-service)
      - "traefik.http.routers.device-service.rule=PathPrefix(`/device-service`)"
      - "traefik.http.routers.device-service.entrypoints=web"
      - "traefik.http.routers.device-service.priority=50"
      - "traefik.http.routers.device-service.middlewares=jwt-auth@docker"
      - "traefik.http.routers.device-service.service=device-service"
      - "traefik.http.services.device-service.loadbalancer.server.port=8081"


  # =====================================================================
  # 5. AUTHORIZATION SERVICE (cu Load Balancing - 2 replici)
  # =====================================================================
  auth-service:
    build:
      context: ./auth-microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PORT: 8082
    depends_on:
      - auth-db
    networks:
      - demo_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-service.rule=PathPrefix(`/auth-service`)"
      - "traefik.http.routers.auth-service.entrypoints=web"
      - "traefik.http.routers.auth-service.priority=50"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8082"
      # Middleware ForwardAuth pentru validarea token-urilor JWT la nivel de API Gateway
      - "traefik.http.middlewares.jwt-auth.forwardauth.address=http://auth-service:8082/auth-service/auth/validate"
      - "traefik.http.middlewares.jwt-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.jwt-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Name,X-User-Role"

  # =====================================================================
  # 6. FRONTEND (ruteaza radacina catre Nginx)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - user-service
      - device-service
    networks:
      - demo_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  user-mysql-data:
  device-mysql-data:
  auth-mysql-data:
  traefik_logs:

networks:
  demo_net:
    name: demo_net
