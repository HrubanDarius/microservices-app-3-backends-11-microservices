###############################################
### ENV FILE USE ###
###############################################
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_HOST:localhost}
database.port = ${DB_PORT:${DEVICE_DB_PORT}}
database.name = ${DB_NAME:${DEVICE_DB_NAME}}
database.user = ${DB_USER:${DEVICE_DB_USER}}
database.password = ${DB_PASSWORD:${DEVICE_DB_PASSWORD}}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

###############################################
### JPA / HIBERNATE ###
###############################################
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=error

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:${DEVICE_SERVICE_PORT}}
server.servlet.context-path=/device-service

###############################################
### SPRINGDOC / SWAGGER CONFIGURATIONS     ###
###############################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Dezactivare integrare automata HATEOAS si Data REST in SpringDoc
springdoc.enable-hateoas=false
springdoc.enable-data-rest=false
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration,org.springdoc.core.configuration.SpringDocDataRestConfiguration
