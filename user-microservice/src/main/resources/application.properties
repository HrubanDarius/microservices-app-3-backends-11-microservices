###############################################
### ENV FILE USE ###
###############################################
# Cauta .env atat in folderul curent, cat si in folderul parinte PROIECT
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_HOST:localhost}
database.port = ${DB_PORT:${USER_DB_PORT}}
database.name = ${DB_NAME:${USER_DB_NAME}}
database.user = ${DB_USER:${USER_DB_USER}}
database.password = ${DB_PASSWORD:${USER_DB_PASSWORD}}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

###############################################
### JPA / HIBERNATE ###
###############################################
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=error

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:${USER_SERVICE_PORT}}
server.servlet.context-path=/user-service